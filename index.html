<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lin Nail美甲工作室 - 預約系統</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C2A3AC">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <style>
        body { background-color: #F5EEF0; color: #5C4E54; font-family: 'Helvetica Neue', '微軟正黑體', Arial, sans-serif; padding: 20px 10px; }
        .container-fluid { max-width: 1250px; }
        .booking-card { background: #FFFFFF; border: none; border-radius: 20px; box-shadow: 0 8px 24px rgba(174, 139, 150, 0.15); padding: 25px; margin-bottom: 25px; }
        h2, h3 { color: #AE8B96; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .form-control, .form-select { border: 1px solid #E0D4D8; border-radius: 12px; padding: 12px; background-color: #FCFAFB; color: #5C4E54; }
        .form-control:focus, .form-select:focus { border-color: #C2A3AC; box-shadow: 0 0 0 0.25rem rgba(194, 163, 172, 0.25); }
        .form-label { font-weight: 600; color: #8A737A; margin-bottom: 8px; }
        .btn-primary { background-color: #C2A3AC; border: none; border-radius: 12px; padding: 14px 20px; font-weight: bold; font-size: 1.1rem; color: white; width: 100%; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: #B08E98 !important; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(176, 142, 152, 0.4); }
        .btn-outline-secondary { border-radius: 12px; border-color: #C2A3AC; color: #C2A3AC; font-weight: bold; }
        .btn-outline-secondary:hover { background-color: #C2A3AC; color: white; }
        :root { --fc-border-color: #EEDEE2; --fc-button-bg-color: #C2A3AC; --fc-button-border-color: #C2A3AC; --fc-button-hover-bg-color: #B08E98; --fc-button-active-bg-color: #B08E98; --fc-today-bg-color: #FCFAFB; }
        
        #customerCalendar { background: white; padding: 15px; border-radius: 15px; min-height: 500px; font-size: 1em; }
        .fc-header-toolbar h2 { font-size: 1.3rem !important; color: #8A737A !important; margin: 0 !important; }
        
        .fc-event {
            white-space: normal !important; 
            word-break: break-word !important; 
            line-height: 1.2 !important;
            margin-bottom: 2px !important;
            border: none !important;
        }
        .fc-event-title {
            font-size: 0.75rem;
            text-align: center;
            display: block;
        }
        
        .fc-daygrid-day-frame { min-height: 80px !important; padding: 2px; }

        @media (max-width: 768px) {
            body { padding: 10px 5px; } 
            .booking-card { padding: 12px; margin-bottom: 15px; } 
            #customerCalendar { padding: 5px; min-height: 400px; font-size: 0.9em; }
            .fc-daygrid-day-frame { min-height: 60px !important; }
            .fc-header-toolbar h2 { font-size: 1.1rem !important; }
            .fc-toolbar-chunk { display: flex; gap: 5px; align-items: center; }
            .fc-timeGridWeek-button, .fc-dayGridMonth-button { display: none !important; }
        }

        .calendar-hint { font-size: 0.85rem; margin-bottom: 10px; text-align: left; color: #8A737A; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        
        .time-btn { padding: 10px 15px; border: 1px solid #C2A3AC; background-color: white; color: #5C4E54; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; text-align: center; white-space: pre-wrap;}
        .time-btn:hover:not(:disabled) { background-color: #F5EEF0; }
        .time-btn.selected { background-color: #C2A3AC; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(194, 163, 172, 0.4); }
        .time-btn:disabled { border-color: #E0D4D8; background-color: #FCFAFB; color: #BDBDBD; cursor: not-allowed; font-size: 0.85rem;}
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row g-4">
        <div class="col-lg-7 col-12">
            <div class="booking-card h-100">
                <h3>📅 本月預約狀態看板</h3>
                <div class="calendar-hint">
                    <span class="dot" style="background-color: #A3C2A3;"></span> ✨ 可預約
                    <span class="dot" style="background-color: #D6C5C9;"></span> 🚫 已被預約 
                    <span class="dot" style="background-color: #7A7A7A;"></span> 🔒 休息/店休
                    <br><small class="text-muted">💡 點擊行事曆上的「日期」，下方就會出現可預約的時段！</small>
                </div>
                <div id="customerCalendar"></div>
            </div>
        </div>

        <div class="col-lg-5 col-12">
            <div class="booking-card">
                <h2>✨ 線上快速預約 ✨</h2>
                <form id="bookingForm">
                    <div class="mb-3">
                        <label class="form-label">您的姓名</label>
                        <input type="text" class="form-control" id="userName" required placeholder="例如：王小明">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">聯絡電話</label>
                        <input type="tel" class="form-control" id="userPhone" required placeholder="例如：0912345678">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">預約時間</label>
                        <div class="row g-2">
                            <div class="col-12">
                                <input type="date" class="form-control" id="bookingDate" required onchange="fetchTimeSlots()">
                            </div>
                            <div class="col-12 mt-3">
                                <label class="form-label" style="font-size: 0.9rem;">選擇時段：</label>
                                <div id="timeSlotsContainer" class="d-flex flex-wrap gap-2">
                                    <p class="text-muted mb-0" style="font-size: 0.85rem;">請先選擇上方日期，系統將顯示可預約的時段喔！</p>
                                </div>
                                <input type="hidden" id="selectedTime" required>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">送出預約</button>
                </form>
            </div>

            <div class="booking-card">
                <h3>🔍 查詢我的預約</h3>
                <div class="row g-2 mb-3">
                    <div class="col-5">
                        <input type="text" class="form-control" id="searchName" placeholder="您的姓名">
                    </div>
                    <div class="col-5">
                        <input type="tel" class="form-control" id="searchPhone" placeholder="聯絡電話">
                    </div>
                    <div class="col-2">
                        <button class="btn btn-outline-secondary w-100 px-0" type="button" id="searchBtn">查詢</button>
                    </div>
                </div>
                <div id="searchResults" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://nail-booking-api-bx93.onrender.com";
    let calendar;

    document.addEventListener("DOMContentLoaded", function() {
        initCustomerCalendar();
    });

    const dateInput = document.getElementById('bookingDate');
    if(dateInput) {
        const today = new Date();
        today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
        dateInput.setAttribute('min', today.toISOString().split('T')[0]);
    }

    async function fetchTimeSlots() {
        const dateStr = document.getElementById("bookingDate").value;
        const container = document.getElementById("timeSlotsContainer");
        const selectedTimeInput = document.getElementById("selectedTime");
        
        if (!dateStr) return;
        
        selectedTimeInput.value = ""; 
        container.innerHTML = "<p class='text-muted mb-0' style='font-size: 0.85rem;'>查詢時段中... ⏳</p>";
        
        try {
            const response = await fetch(`${API_URL}/daily-schedule?date_str=${dateStr}`);
            const data = await response.json();
            
            container.innerHTML = ""; 
            
            if (!data.slots || data.slots.length === 0) {
                container.innerHTML = "<p class='text-muted mb-0' style='font-size: 0.85rem;'>這天沒有開放的時段喔！</p>";
                return;
            }

            data.slots.forEach(slot => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "time-btn flex-fill"; 
                
                if (slot.status === "可預約") {
                    btn.innerText = slot.time;
                    btn.onclick = () => {
                        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedTimeInput.value = slot.time;
                    };
                } else {
                    btn.innerText = `${slot.time}\n(${slot.reason})`;
                    btn.disabled = true;
                }
                container.appendChild(btn);
            });

        } catch (error) {
            console.error("抓取時段失敗:", error);
            container.innerHTML = "<p class='text-danger mb-0' style='font-size: 0.85rem;'>連線失敗，請稍後再試或聯繫老闆！</p>";
        }
    }

    function initCustomerCalendar() {
        const calendarEl = document.getElementById('customerCalendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'zh-tw',
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            buttonText: { today: '今天' },
            height: 'auto',
            displayEventTime: false, 
            dateClick: function(info) {
                let clickedDate = info.dateStr.split("T")[0];
                const todayStr = new Date().toISOString().split('T')[0];
                if (clickedDate >= todayStr) {
                    document.getElementById("bookingDate").value = clickedDate;
                    fetchTimeSlots(); 
                }
            },
            eventClick: function(info) {
                if (info.event.title.includes("可預約")) {
                    Swal.fire({
                        title: '這是可預約空檔！',
                        text: '系統已自動為您載入日期，請在右方選單直接點擊時段喔！',
                        icon: 'success',
                        confirmButtonColor: '#A3C2A3'
                    });
                    
                    let clickedDate = info.event.startStr.split("T")[0];
                    document.getElementById("bookingDate").value = clickedDate;
                    fetchTimeSlots(); 
                    
                } else if (info.event.title.includes("休息") || info.event.title.includes("店休")) {
                    Swal.fire({
                        title: info.event.title,
                        text: "老闆此時段休息或外出，請選擇其他空檔喔！",
                        icon: 'info',
                        confirmButtonColor: '#7A7A7A'
                    });
                } else {
                    Swal.fire({
                        title: info.event.title, 
                        text: "此時段已被其他客人預約，請選擇其他空檔！",
                        icon: 'warning',
                        confirmButtonColor: '#C2A3AC'
                    });
                }
            },
            events: fetchCustomerEvents
        });
        calendar.render();
    }

    async function fetchCustomerEvents(fetchInfo, successCallback, failureCallback) {
        try {
            // 🐛 在這裡拿掉網址結尾的斜線
            const response = await fetch(`${API_URL}/bookings`);
            const data = await response.json();
            
            const events = data.map(b => {
                const timeString = b.start_time || b.booking_time;
                const nameString = b.user_name || b.customer_name || "";
                if (!timeString) return null;

                let startTime = new Date(timeString);
                let endTime = new Date(startTime.getTime() + 2 * 60 * 60 * 1000); 
                
                const isBoss = nameString.includes("🔒") || nameString.includes("休息") || nameString.includes("老闆") || nameString.includes("店休");
                const isAvailable = nameString.includes("可預約");
                const isAllDay = nameString.includes("整天休息") || nameString.includes("店休");

                let eventTitle = "🚫 已被預約";
                let eventColor = "#D6C5C9";

                if (isAvailable) {
                    let hm = startTime.getHours().toString().padStart(2, '0') + ':' + startTime.getMinutes().toString().padStart(2, '0');
                    eventTitle = `✨ ${hm} 可預約`;
                    eventColor = "#A3C2A3"; 
                } else if (isBoss) {
                    eventTitle = nameString.includes("🔒") ? nameString : `🔒 ${nameString}`;
                    eventColor = "#7A7A7A"; 
                } else {
                    eventTitle = "🚫 已被預約";
                    eventColor = "#D6C5C9"; 
                }

                return {
                    title: eventTitle,
                    start: timeString,
                    end: isAllDay ? null : endTime.toISOString(),
                    allDay: isAllDay,
                    color: eventColor,
                    editable: false
                };
            }).filter(e => e !== null);
            successCallback(events);
        } catch (error) {
            failureCallback(error);
        }
    }

    document.getElementById("bookingForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const date = document.getElementById("bookingDate").value;
        const selectedTime = document.getElementById("selectedTime").value;

        if(!date || !selectedTime) {
            Swal.fire({ icon: 'warning', text: '請完整選擇預約日期與「時段按鈕」！', confirmButtonColor: '#C2A3AC' });
            return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ 預約發送中...";

        const rawData = {
            user_name: document.getElementById("userName").value.trim(),
            user_phone: document.getElementById("userPhone").value.trim(),
            start_time: `${date}T${selectedTime}:00`
        };

        try {
            // 🐛 在這裡拿掉網址結尾的斜線
            const response = await fetch(`${API_URL}/bookings`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(rawData)
            });
            
            if(response.ok) {
                Swal.fire({ title: '預約成功！', text: '期待為您服務 💅', icon: 'success', confirmButtonColor: '#C2A3AC' })
                .then(() => {
                    document.getElementById('bookingForm').reset();
                    document.getElementById('selectedTime').value = ""; 
                    document.getElementById('timeSlotsContainer').innerHTML = "<p class='text-muted mb-0' style='font-size: 0.85rem;'>請先選擇上方日期，系統將顯示可預約的時段喔！</p>";
                    calendar.refetchEvents(); 
                });
            } else {
                let data = await response.json();
                let errorMessage = data.detail ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : "格式錯誤";
                Swal.fire({ title: '預約失敗', text: `原因：${errorMessage}`, icon: 'error', confirmButtonColor: '#C2A3AC' });
            }
        } catch (error) {
            Swal.fire({ title: '連線中斷', text: '無法連上伺服器', icon: 'warning', confirmButtonColor: '#C2A3AC' });
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "送出預約";
        }
    });

    document.getElementById("searchBtn").addEventListener("click", async function() {
        const name = document.getElementById("searchName").value.trim();
        const phone = document.getElementById("searchPhone").value.trim();

        if(!name || !phone) {
            Swal.fire({ icon: 'warning', text: '請同時輸入「姓名」與「聯絡電話」！', confirmButtonColor: '#C2A3AC' });
            return;
        }
        const resultsDiv = document.getElementById("searchResults");
        resultsDiv.innerHTML = "<p class='text-muted text-center'>🔍 查詢中...</p>";

        try {
            // 🐛 在這裡拿掉網址結尾的斜線
            const res = await fetch(`${API_URL}/bookings`);
            if(res.ok) {
                const allBookings = await res.json();
                const myBookings = allBookings.filter(b => 
                    (b.user_name === name || b.customer_name === name) && 
                    (b.user_phone === phone || b.phone === phone)
                );
                
                if(!myBookings || myBookings.length === 0) {
                    resultsDiv.innerHTML = "<p class='text-muted text-center'>找不到符合的預約，請確認資料是否正確！</p>";
                    return;
                }
                
                let html = "<ul class='list-group'>";
                myBookings.forEach(b => {
                    const timeString = b.start_time || b.booking_time; 
                    if(!timeString) return;
                    const dt = new Date(timeString);
                    const displayTime = isNaN(dt.getTime()) ? "時間格式有誤" : dt.toLocaleString('zh-TW', {month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                    const bookingId = b.id || b._id || "";

                    html += `<li class='list-group-item d-flex justify-content-between align-items-center' style='border-color: #E0D4D8;'>
                                <div style='color: #5C4E54; text-align: left;'><b>${b.service_name || '美甲預約'}</b><br><small>${displayTime}</small></div>
                                <div>
                                    <span class='badge me-2' style='background-color: #C2A3AC; font-size: 0.9rem;'>${b.status || '已確認'}</span>
                                    ${bookingId ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking('${bookingId}')">取消</button>` : ''}
                                </div>
                             </li>`;
                });
                html += "</ul>";
                resultsDiv.innerHTML = html;
            } else {
                resultsDiv.innerHTML = "<p class='text-danger text-center'>查詢失敗，請稍後再試。</p>";
            }
        } catch (error) {
            resultsDiv.innerHTML = "<p class='text-danger text-center'>連線失敗，請稍後再試。</p>";
        }
    });

    window.cancelBooking = async function(id) {
        const result = await Swal.fire({
            title: '確定要取消預約嗎？',
            text: "取消後無法恢復喔！",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#C2A3AC',
            confirmButtonText: '確認取消',
            cancelButtonText: '保留預約'
        });

        if (result.isConfirmed) {
            try {
                const res = await fetch(`${API_URL}/bookings/${id}`, { method: "DELETE" });
                if(res.ok) {
                    Swal.fire({ title: '已取消', text: '您的預約已經成功取消！', icon: 'success', confirmButtonColor: '#C2A3AC' });
                    document.getElementById("searchBtn").click(); 
                    calendar.refetchEvents();
                } else {
                    Swal.fire({ title: '取消失敗', text: '請聯繫老闆人工處理。', icon: 'error', confirmButtonColor: '#C2A3AC' });
                }
            } catch (error) {
                Swal.fire({ title: '連線中斷', icon: 'warning', confirmButtonColor: '#C2A3AC' });
            }
        }
    };
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker 註冊成功！', reg))
                .catch(err => console.log('Service Worker 註冊失敗', err));
        });
    }
</script>
</body>
</html>
