<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老闆專屬 - VIP 管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #F5EEF0; color: #5C4E54; font-family: '微軟正黑體', sans-serif; padding: 20px 10px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(174, 139, 150, 0.15); }
        h2 { color: #AE8B96; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .btn-primary { background-color: #C2A3AC; border: none; }
        .btn-primary:hover { background-color: #B08E98; }
        .btn-sync { background-color: #8A737A; color: white; font-weight: bold; }
        .btn-sync:hover { background-color: #5C4E54; color: white; }
        table { margin-top: 20px; }
        th { background-color: #FCFAFB !important; color: #AE8B96 !important; }
        .badge-vip { background-color: #A3C2A3; color: white; padding: 5px 10px; border-radius: 12px; font-size: 0.85rem;}
        
        #loginSection { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(174, 139, 150, 0.15); text-align: center;}
        #mainContent { display: none; }
    </style>
</head>
<body>

<div id="loginSection">
    <h3 style="color: #AE8B96; font-weight: bold; margin-bottom: 20px;">🔒 老闆專屬後台</h3>
    <input type="password" id="bossPwd" class="form-control mb-3" placeholder="請輸入密碼">
    <button class="btn btn-primary w-100" onclick="login()">登入</button>
</div>

<div class="container" id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">👑 VIP 熟客名單管理</h2>
        <!-- ★ 一鍵同步按鈕 -->
        <button class="btn btn-sync" onclick="syncVips()">✨ 自動同步日曆</button>
    </div>
    
    <div class="card mb-4" style="border-color: #E0D4D8;">
        <div class="card-body">
            <h5 class="card-title" style="color: #8A737A;">新增全新 VIP 客戶</h5>
            <div class="row g-2">
                <div class="col-md-5">
                    <input type="text" id="newName" class="form-control" placeholder="客戶姓名">
                </div>
                <div class="col-md-5">
                    <!-- ★ 工程師自己測試：可以在這裡輸入你的電話 -->
                    <input type="tel" id="newPhone" class="form-control" placeholder="聯絡電話">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="addVip()">新增</button>
                </div>
            </div>
            <small class="text-muted mt-2 d-block">💡 你可以在這裡手動加入工程師自己的號碼來測試 VIP 功能喔！</small>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>聯絡電話</th>
                    <th>狀態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="vipList">
                <!-- 資料會載入在這裡 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://nail-booking-api-bx93.onrender.com";
    let currentPwd = "";

    document.getElementById("bossPwd").addEventListener("keypress", function(event) {
        if (event.key === "Enter") login();
    });

    async function login() {
        const pwd = document.getElementById("bossPwd").value;
        if (!pwd) return;

        try {
            const res = await fetch(`${API_URL}/api/vips?pwd=${pwd}`);
            if (res.ok) {
                currentPwd = pwd;
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
                const vips = await res.json();
                renderVipList(vips);
            } else {
                Swal.fire("錯誤", "密碼錯誤！", "error");
            }
        } catch (e) {
            Swal.fire("錯誤", "無法連線至伺服器", "error");
        }
    }

    async function loadVips() {
        try {
            const res = await fetch(`${API_URL}/api/vips?pwd=${currentPwd}`);
            if (res.ok) {
                const vips = await res.json();
                renderVipList(vips);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function renderVipList(vips) {
        const tbody = document.getElementById("vipList");
        tbody.innerHTML = "";
        
        if(vips.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' class='text-muted'>目前尚無名單，可點擊上方「自動同步日曆」載入舊客。</td></tr>";
            return;
        }

        vips.forEach(vip => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${vip.user_name}</b></td>
                    <td>${vip.user_phone}</td>
                    <td><span class="badge-vip">👑 VIP</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteVip('${vip.user_phone}')">移除</button>
                    </td>
                </tr>
            `;
        });
    }

    async function addVip() {
        const name = document.getElementById("newName").value.trim();
        const phone = document.getElementById("newPhone").value.trim();
        
        if (!name || !phone) {
            Swal.fire("提示", "請完整填寫姓名與電話喔！", "warning");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/vips?pwd=${currentPwd}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_name: name, user_phone: phone })
            });

            if (res.ok) {
                Swal.fire("成功", "已加入 VIP 名單！", "success");
                document.getElementById("newName").value = "";
                document.getElementById("newPhone").value = "";
                loadVips(); 
            } else {
                const data = await res.json();
                Swal.fire("失敗", data.detail, "error");
            }
        } catch (e) {
            Swal.fire("錯誤", "無法連上伺服器", "error");
        }
    }

    async function deleteVip(phone) {
        if (!confirm("確定要移除這位客人的 VIP 資格嗎？")) return;
        
        try {
            const res = await fetch(`${API_URL}/api/vips/${phone}?pwd=${currentPwd}`, {
                method: "DELETE"
            });

            if (res.ok) {
                Swal.fire("已移除", "該客人已降為一般客人", "success");
                loadVips();
            } else {
                Swal.fire("失敗", "移除失敗", "error");
            }
        } catch (e) {
            Swal.fire("錯誤", "無法連上伺服器", "error");
        }
    }

    // ★ 呼叫後端執行 Google 日曆大掃描
    async function syncVips() {
        Swal.fire({
            title: '正在掃描 Google 日曆...',
            text: '這可能需要幾十秒鐘，請耐心等候',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            const res = await fetch(`${API_URL}/api/sync-vips?pwd=${currentPwd}`, { method: "POST" });
            const data = await res.json();
            
            if (res.ok) {
                Swal.fire("同步完成！", data.message, "success");
                loadVips(); // 重抓最新名單
            } else {
                Swal.fire("同步失敗", data.detail, "error");
            }
        } catch (e) {
            Swal.fire("錯誤", "無法連線至伺服器", "error");
        }
    }
</script>
</body>
</html>
