<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老闆專屬 - 營運管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #F5EEF0; color: #5C4E54; font-family: '微軟正黑體', sans-serif; padding: 20px 10px; }
        .container { max-width: 1000px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(174, 139, 150, 0.15); margin: auto; }
        h2 { color: #AE8B96; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .btn-primary { background-color: #C2A3AC; border: none; }
        .btn-primary:hover { background-color: #B08E98; }
        .btn-sync { background-color: #8A737A; color: white; font-weight: bold; }
        .btn-sync:hover { background-color: #5C4E54; color: white; }
        
        table { margin-top: 20px; width: 100%; }
        th { background-color: #FCFAFB !important; color: #AE8B96 !important; }
        .badge-vip { background-color: #A3C2A3; color: white; padding: 5px 10px; border-radius: 12px; font-size: 0.85rem;}
        
        #loginSection { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(174, 139, 150, 0.15); text-align: center;}
        #mainContent { display: none; }
        
        .nav-pills .nav-link { color: #8A737A; border-radius: 12px; margin-right: 10px; margin-bottom: 5px; }
        .nav-pills .nav-link.active { background-color: #C2A3AC; color: white; font-weight: bold;}

        /* ================= 專屬手機版 RWD 調整 (老闆卡片式表格) ================= */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h2 { font-size: 1.3rem; }
            .nav-pills { flex-direction: column; }
            .nav-pills .nav-link { margin-right: 0; text-align: center; }
            
            /* 讓 Table 變成卡片清單 (Responsive Table to Cards) */
            .table-responsive table, .table-responsive thead, .table-responsive tbody, .table-responsive th, .table-responsive td, .table-responsive tr { 
                display: block; 
            }
            /* 隱藏原本的表頭 */
            .table-responsive thead tr { 
                position: absolute; top: -9999px; left: -9999px; 
            }
            .table-responsive tr { 
                border: 1px solid #E0D4D8; border-radius: 10px; margin-bottom: 15px; background-color: white; padding: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            }
            .table-responsive td { 
                border: none; border-bottom: 1px solid #F5EEF0; position: relative; padding-left: 45%; text-align: left !important; min-height: 40px; display: flex; align-items: center;
            }
            .table-responsive td:last-child { border-bottom: 0; }
            /* 利用 data-label 屬性偽造表頭 */
            .table-responsive td:before { 
                position: absolute; top: 50%; left: 10px; transform: translateY(-50%); width: 40%; white-space: nowrap; font-weight: bold; color: #8A737A; font-size: 0.9rem;
            }
            
            /* 分別針對不同表格設定假表頭名稱 */
            #adminBookingList td:nth-of-type(1):before { content: "預約時段"; }
            #adminBookingList td:nth-of-type(2):before { content: "客戶資料"; }
            #adminBookingList td:nth-of-type(3):before { content: "部位/末5碼"; }
            #adminBookingList td:nth-of-type(4):before { content: "狀態/倒數"; }
            #adminBookingList td:nth-of-type(5):before { content: "老闆操作"; }

            #vipList td:nth-of-type(1):before { content: "姓名"; }
            #vipList td:nth-of-type(2):before { content: "聯絡電話"; }
            #vipList td:nth-of-type(3):before { content: "狀態"; }
            #vipList td:nth-of-type(4):before { content: "操作"; }

            /* 優化手機上的選單與按鈕 */
            .form-select-sm { font-size: 1rem; padding: 8px 10px; width: 100% !important; margin-top: 5px; }
            .btn-sm { font-size: 0.95rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

<div id="loginSection">
    <h3 style="color: #AE8B96; font-weight: bold; margin-bottom: 20px;">🔒 營運管理後台</h3>
    <input type="password" id="bossPwd" class="form-control mb-3" placeholder="請輸入密碼">
    <button class="btn btn-primary w-100" onclick="login()">登入</button>
</div>

<div class="container" id="mainContent">
    
    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="pills-booking-tab" data-bs-toggle="pill" data-bs-target="#pills-booking" type="button" role="tab">📅 預約對帳管理</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-vip-tab" data-bs-toggle="pill" data-bs-target="#pills-vip" type="button" role="tab">👑 VIP 熟客名單</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <!-- ================= 對帳管理 ================= -->
        <div class="tab-pane fade show active" id="pills-booking" role="tabpanel">
            <div class="alert alert-info" style="background-color: #FCFAFB; border-color: #E0D4D8; color: #8A737A; font-size: 0.9rem;">
                💡 <b>自動守門員</b>：狀態為「⏳ 待匯款」且建立超過 72 小時的單，系統會自動取消。<br>
                (客人在預約時有填寫數字末五碼會自動設為「👀 待對帳」，不會被取消。)
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center m-0">
                    <thead>
                        <tr>
                            <th>預約時段</th>
                            <th>客戶資料</th>
                            <th>部位 / 末5碼</th>
                            <th>狀態 / 倒數</th>
                            <th>老闆操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminBookingList">
                        <!-- 資料載入區 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ================= VIP 管理 ================= -->
        <div class="tab-pane fade" id="pills-vip" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0" style="color: #AE8B96; font-weight: bold;">👑 VIP 名單</h4>
                <button class="btn btn-sync btn-sm" onclick="syncVips()">✨ 自動同步</button>
            </div>
            
            <div class="card mb-4" style="border-color: #E0D4D8;">
                <div class="card-body p-3">
                    <h6 class="card-title mb-2" style="color: #8A737A;">新增 VIP</h6>
                    <div class="row g-2">
                        <div class="col-md-5 col-12">
                            <input type="text" id="newName" class="form-control" placeholder="姓名 (必填)">
                        </div>
                        <div class="col-md-5 col-12">
                            <input type="tel" id="newPhone" class="form-control" placeholder="電話 (可空白)">
                        </div>
                        <div class="col-md-2 col-12">
                            <button class="btn btn-primary w-100" onclick="addVip()">新增</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle text-center m-0">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>聯絡電話</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="vipList">
                        <!-- 資料載入區 -->
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</div>

<script>
    const API_URL = "https://nail-booking-api-bx93.onrender.com";
    let currentPwd = "";

    document.getElementById("bossPwd").addEventListener("keypress", function(event) {
        if (event.key === "Enter") login();
    });

    async function login() {
        const pwd = document.getElementById("bossPwd").value;
        if (!pwd) return;

        try {
            const res = await fetch(`${API_URL}/api/admin/bookings?pwd=${pwd}`);
            if (res.ok) {
                currentPwd = pwd;
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
                
                const bookings = await res.json();
                renderAdminBookings(bookings);
                loadVips(); 
            } else {
                Swal.fire("錯誤", "密碼錯誤！", "error");
            }
        } catch (e) {
            Swal.fire("錯誤", "無法連線至伺服器", "error");
        }
    }

    // ================= 預約對帳功能 =================
    async function loadAdminBookings() {
        try {
            const res = await fetch(`${API_URL}/api/admin/bookings?pwd=${currentPwd}`);
            if (res.ok) {
                const bookings = await res.json();
                renderAdminBookings(bookings);
            }
        } catch (e) { console.error(e); }
    }

    function renderAdminBookings(bookings) {
        const tbody = document.getElementById("adminBookingList");
        tbody.innerHTML = "";
        if(bookings.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' class='text-muted text-center py-4'>目前沒有未來的預約紀錄。</td></tr>";
            return;
        }
        
        bookings.forEach(b => {
            let statusBadge = "";
            let expireHint = "";
            
            if (b.payment_status === "已匯款") {
                statusBadge = `<span class="badge" style="background-color: #A3C2A3;">✅ 已匯款</span>`;
            } else if (b.payment_status === "待對帳") {
                statusBadge = `<span class="badge bg-warning text-dark">👀 待對帳</span>`;
            } else {
                statusBadge = `<span class="badge bg-danger">⏳ 待匯款</span>`;
                const createdDate = new Date(b.created_at);
                const expireDate = new Date(createdDate.getTime() + 72 * 60 * 60 * 1000);
                const now = new Date();
                const diffHours = Math.floor((expireDate - now) / (1000 * 60 * 60));
                
                if (diffHours > 0) {
                    expireHint = `<br><small class="text-danger fw-bold">剩餘 ${diffHours} 小時</small>`;
                } else {
                    expireHint = `<br><small class="text-danger fw-bold">即將刪除</small>`;
                }
            }

            tbody.innerHTML += `
                <tr>
                    <td><b>${b.start_time_display}</b><br><small class="text-muted d-none d-md-block">建單: ${b.created_at_display}</small></td>
                    <td>${b.user_name}<br><small class="text-muted">${b.user_phone}</small></td>
                    <td>${b.service_type}<br><span class="text-primary fw-bold">${b.remittance_last_5}</span></td>
                    <td>${statusBadge}${expireHint}</td>
                    <td>
                        <select class="form-select form-select-sm d-inline-block w-auto" onchange="changeBookingStatus(${b.id}, this.value)">
                            <option value="" disabled selected>切換狀態</option>
                            <option value="已匯款">✅ 已匯款</option>
                            <option value="待對帳">👀 待對帳</option>
                            <option value="待匯款">⏳ 待匯款</option>
                        </select>
                    </td>
                </tr>
            `;
        });
    }

    async function changeBookingStatus(id, newStatus) {
        try {
            const res = await fetch(`${API_URL}/api/admin/bookings/${id}/status?status=${newStatus}&pwd=${currentPwd}`, { method: "PUT" });
            if (res.ok) {
                Swal.fire({title: "狀態已更新", icon: "success", toast: true, position: "top-end", timer: 2000, showConfirmButton: false});
                loadAdminBookings(); 
            }
        } catch (e) { Swal.fire("錯誤", "更新失敗", "error"); }
    }


    // ================= VIP 管理功能 =================
    async function loadVips() {
        try {
            const res = await fetch(`${API_URL}/api/vips?pwd=${currentPwd}`);
            if (res.ok) renderVipList(await res.json());
        } catch (e) { console.error(e); }
    }

    function renderVipList(vips) {
        const tbody = document.getElementById("vipList");
        tbody.innerHTML = "";
        if(vips.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' class='text-muted text-center py-4'>目前尚無名單。</td></tr>";
            return;
        }
        vips.forEach(vip => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${vip.user_name}</b></td>
                    <td style="color: ${vip.user_phone === '尚未提供電話' ? '#d9534f' : '#5C4E54'}">${vip.user_phone}</td>
                    <td><span class="badge-vip">👑 VIP</span></td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteVip('${vip.user_name}')">移除</button></td>
                </tr>
            `;
        });
    }

    async function addVip() {
        const name = document.getElementById("newName").value.trim();
        const phone = document.getElementById("newPhone").value.trim();
        if (!name) { Swal.fire("提示", "一定要填寫姓名喔！", "warning"); return; }
        try {
            const res = await fetch(`${API_URL}/api/vips?pwd=${currentPwd}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_name: name, user_phone: phone || null })
            });
            if (res.ok) {
                Swal.fire("成功", (await res.json()).message, "success");
                document.getElementById("newName").value = "";
                document.getElementById("newPhone").value = "";
                loadVips(); 
            } else Swal.fire("失敗", (await res.json()).detail, "error");
        } catch (e) { Swal.fire("錯誤", "無法連上伺服器", "error"); }
    }

    async function deleteVip(name) {
        if (!confirm(`確定移除 ${name} 嗎？`)) return;
        try {
            const res = await fetch(`${API_URL}/api/vips/${encodeURIComponent(name)}?pwd=${currentPwd}`, { method: "DELETE" });
            if (res.ok) { Swal.fire("已移除", "成功", "success"); loadVips(); }
            else Swal.fire("失敗", "移除失敗", "error");
        } catch (e) { Swal.fire("錯誤", "無法連上伺服器", "error"); }
    }

    async function syncVips() {
        Swal.fire({ title: '掃描中...', text: '請稍候', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
            const res = await fetch(`${API_URL}/api/sync-vips?pwd=${currentPwd}`, { method: "POST" });
            if (res.ok) { Swal.fire("完成！", (await res.json()).message, "success"); loadVips(); }
            else Swal.fire("失敗", (await res.json()).detail, "error");
        } catch (e) { Swal.fire("錯誤", "無法連線", "error"); }
    }
</script>
</body>
</html>
